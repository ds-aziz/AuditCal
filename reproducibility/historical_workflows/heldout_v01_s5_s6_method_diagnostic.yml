name: AuditCal method review - S5 Patsy and S6 CI rounding
on:
  push:
    branches: [auditcal-starter-v0-1]
    paths:
      - '.github/workflows/heldout_v01_s5_s6_method_diagnostic.yml'
      - 'experiments/heldout_v01_s5_s6_method_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s5-s6-method-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formula parsing (no model re-fitting)
        run: python -m pip install 'numpy>=2,<3' 'pandas>=2,<4' 'patsy>=1,<2'
      - name: Download pinned official METR data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external_data
          curl -fLsS --retry 2 --max-time 120 'https://raw.githubusercontent.com/METR/Measuring-Early-2025-AI-on-Exp-OSS-Devs/7ff2d7670235f531dff77eff58355bd77392f396/data_complete.csv' -o external_data/metr.csv
      - name: Check S5 bitwise model term and fixed S5/S6 decimal boundaries
        run: python -m experiments.heldout_v01_s5_s6_method_diagnostic --metr external_data/metr.csv
      - name: Archive traceable method diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-s6-formula-and-rounding-not-gold
          path: results/heldout_v01/s5_s6_method_rounding.json
          if-no-files-found: ignore
