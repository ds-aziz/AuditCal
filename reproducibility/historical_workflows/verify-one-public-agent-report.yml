name: Verify one original public AI-agent report

on:
  push:
    branches: [auditcal-starter-v0-1]
    paths:
      - '.github/workflows/verify-one-public-agent-report.yml'
      - 'experiments/verify_public_agent_report.py'
      - 'experiments/ingest_published_agent_reports.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-report:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out AuditCal (Codex Cloud not required)
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small AuditCal package
        run: python -m pip install -e .
      - name: Download only ONE authentic source report (avoid cloning large repo)
        shell: bash
        run: |
          set -euo pipefail
          TARGET='upstream_ai/experiment_data/workspaces/standard/bedrock_us.anthropic.claude-sonnet-4-5-20250929-v1_0/sample_metr/2025-11-12T17-17-32+0000/mirrored_report.txt'
          mkdir -p "$(dirname "$TARGET")"
          URL='https://media.githubusercontent.com/media/amazon-science/agentic-forking-path/main/experiment_data/workspaces/standard/bedrock_us.anthropic.claude-sonnet-4-5-20250929-v1_0/sample_metr/2025-11-12T17-17-32%2B0000/mirrored_report.txt'
          if ! curl --fail --location --show-error --silent --max-time 35 --retry 1 "$URL" --output "$TARGET"; then
            echo "Direct source fetch failed. Cannot verify a genuine report." >&2
            exit 1
          fi
          test -s "$TARGET"
          echo 'Downloaded content byte count:'
          wc -c "$TARGET"
          echo 'Downloaded source SHA256:'
          sha256sum "$TARGET"
      - name: Verify source hash and extract unverified mentions only
        shell: bash
        run: |
          set -euo pipefail
          REPORT='upstream_ai/experiment_data/workspaces/standard/bedrock_us.anthropic.claude-sonnet-4-5-20250929-v1_0/sample_metr/2025-11-12T17-17-32+0000/mirrored_report.txt'
          python -m experiments.verify_public_agent_report "$REPORT" upstream_ai/experiment_data/workspaces --out results/one_verified_public_report.json
          python -m experiments.ingest_published_agent_reports upstream_ai/experiment_data/workspaces --limit 1 --output results/one_report_candidate_mentions.jsonl
          echo 'Authentic source checked; still ZERO scientific errors independently confirmed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save source-triage metadata (NOT full copyrighted report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-agent-report-source-triage
          path: |
            results/one_verified_public_report.json
            results/one_report_candidate_mentions.jsonl
          if-no-files-found: ignore
