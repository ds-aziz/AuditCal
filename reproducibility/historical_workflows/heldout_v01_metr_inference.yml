name: Held-out v0.1 - Independently refit frozen METR claims
on:
  push:
    branches: [auditcal-starter-v0-1]
    paths:
      - '.github/workflows/heldout_v01_metr_inference.yml'
      - 'experiments/heldout_v01_metr_inference.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independently-recompute-metr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independently authored statistics dependencies
        run: python -m pip install 'numpy>=2,<3' 'pandas>=2,<4' 'scipy>=1.13,<2' 'statsmodels>=0.14,<0.16' 'patsy>=1,<2'
      - name: Download hash-pinned official METR dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external_data
          curl -fLsS --retry 2 --max-time 120 'https://raw.githubusercontent.com/METR/Measuring-Early-2025-AI-on-Exp-OSS-Devs/7ff2d7670235f531dff77eff58355bd77392f396/data_complete.csv' -o external_data/metr.csv
      - name: Model-aligned independent METR reanalysis; no agent scripts executed
        run: python -m experiments.heldout_v01_metr_inference --metr external_data/metr.csv
      - name: Retain full numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-v01-metr-model-evidence
          path: results/heldout_v01/metr_model_evidence.json
          if-no-files-found: ignore
