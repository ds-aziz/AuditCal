name: Held-out v0.1 - Independently refit frozen Soccer inference

on:
  push:
    branches: [auditcal-starter-v0-1]
    paths:
      - '.github/workflows/heldout_v01_soccer_inference.yml'
      - 'experiments/heldout_v01_soccer_inference.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independently-recompute-soccer:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent statistical analysis dependencies
        run: python -m pip install 'numpy>=2,<3' 'pandas>=2,<4' 'scipy>=1.13,<2' 'statsmodels>=0.14,<0.16' 'patsy>=1,<2'
      - name: Download source-hash locked public Soccer teaching copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external_data
          curl -fLsS --retry 2 --max-time 120 'https://raw.githubusercontent.com/psu-psychology/psych-490-reproducibility-2024-fall/b35582ee3f2bb4ee2cc8986a0a878081fbad495d/src/surveys/csv/CrowdstormingDataJuly1st.csv' -o external_data/soccer.csv
      - name: Refit frozen S3 S4 S7 S8 estimands independently; no released scripts run
        run: python -m experiments.heldout_v01_soccer_inference --soccer external_data/soccer.csv
      - name: Archive model-specific results and unresolved issues
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-v01-soccer-model-evidence
          path: results/heldout_v01/soccer_model_evidence.json
          if-no-files-found: ignore
