name: Held-out v0.1 - Independent filtered Soccer sample counts

on:
  push:
    branches: [auditcal-starter-v0-1]
    paths:
      - '.github/workflows/heldout_v01_filtered_soccer.yml'
      - 'experiments/heldout_v01_filtered_soccer_counts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-filtered-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only data analysis dependency
        run: python -m pip install 'pandas>=2,<4'
      - name: Download pinned public Soccer educational CSV copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external_data
          curl -fLsS --retry 2 --max-time 120 'https://raw.githubusercontent.com/psu-psychology/psych-490-reproducibility-2024-fall/b35582ee3f2bb4ee2cc8986a0a878081fbad495d/src/surveys/csv/CrowdstormingDataJuly1st.csv' -o external_data/soccer.csv
      - name: Independently reconstruct S3 S7 S8 samples without released agent code
        run: |
          python -m experiments.heldout_v01_filtered_soccer_counts \
            --soccer external_data/soccer.csv
      - name: Archive numerical audit and limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-v01-filtered-soccer-counts
          path: results/heldout_v01/filtered_soccer_sample_evidence.json
          if-no-files-found: ignore
