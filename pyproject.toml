[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcal"
version = "0.1.0"
description = "Conservative structured claim checks for AI-assisted statistical analysis"
requires-python = ">=3.11"
authors = [{name = "Aziz Ur Rehman"}]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
